global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Backend API metrics
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/api/metrics'
    scheme: http

  # Node Exporter (if added later for host metrics)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['node-exporter:9100']

  # Mosquitto MQTT Broker (if exporter is added)
  # - job_name: 'mosquitto'
  #   static_configs:
  #     - targets: ['mosquitto-exporter:9101']

  # PostgreSQL (if exporter is added)
