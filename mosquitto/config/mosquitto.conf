user anonymous

password CHANGE_ME_MQTT_ADMIN_PASS

# Backend service user
user backend_service
password CHANGE_ME_MQTT_INTERNAL_PASS

# ACL Rules
# Backend can read/write all topics
topic readwrite # user backend_service

# Anonymous users (devices) - will be replaced with per-device auth in Phase 1
# For now, allow authenticated users to publish/subscribe to their own topics
topic read sh/+/+/#
topic write sh/+/+/#

# Log settings
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe

# Persistence
persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db

# Listener configuration will be added by docker-compose env overrides
# or separate config files for TLS
