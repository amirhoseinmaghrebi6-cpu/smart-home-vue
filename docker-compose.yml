version: '3.8'

# Smart Home Production Stack - m2smart.ir
# Security Hardened & SSL Ready

services:
  # --- PostgreSQL Database ---
  postgres:
    image: postgres:16-alpine
    container_name: smart-home-postgres
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Expose only internally for security
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-home-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Redis Cache ---
  redis:
    image: redis:7-alpine
    container_name: smart-home-redis
    restart: always
    env_file:
      - ./.env
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # Expose only internally
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-home-net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Mosquitto MQTT Broker (Hardened) ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-home-mosquitto
    restart: always
    ports:
      # Internal only - no direct exposure
      - "127.0.0.1:1883:1883"
      # WebSocket for browser clients (behind Nginx SSL)
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - smart-home-net
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$SYS/#", "-C", "1", "-W", "5"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Backend Node.js API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-home-backend
    restart: always
    # No direct port exposure - all traffic via Nginx
    expose:
      - "3000"
    env_file:
      - ./.env
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MQTT_BROKER: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_INTERNAL_USER}
      MQTT_PASSWORD: ${MQTT_INTERNAL_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: ${JWT_EXPIRY:-86400}
      CORS_ORIGIN: https://${DOMAIN}
      DOMAIN: ${DOMAIN}
      TRUST_PROXY: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - smart-home-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Frontend Vue + Nginx (SSL Termination) ---
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-home-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # SSL Certificates from host
      - ./ssl/certs:/etc/letsencrypt:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    environment:
      VITE_API_BASE_URL: https://${DOMAIN}/api
      VITE_WS_URL: wss://${DOMAIN}
      DOMAIN: ${DOMAIN}
    depends_on:
      - backend
    networks:
      - smart-home-net
    healthcheck:
      test: ["CMD", "curl", "-f", "https://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # --- Nginx Reverse Proxy (Main Entry Point) ---
  # Note: Integrated into frontend service for simplicity
  # SSL termination happens here

  # --- Grafana (Monitoring) ---
  grafana:
    image: grafana/grafana:latest
    container_name: smart-home-grafana
    restart: always
    # Expose only internally - access via Nginx subpath
    expose:
      - "3000"
    env_file:
      - ./.env
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - backend
    networks:
      - smart-home-net

  # --- Prometheus (Metrics Collection) ---
  prometheus:
    image: prom/prometheus:latest
    container_name: smart-home-prometheus
    restart: always
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - smart-home-net
    depends_on:
      - backend

  # --- Portainer (Docker Management) ---
  portainer:
    image: portainer/portainer-ce:latest
    container_name: smart-home-portainer
    restart: always
    # Expose only internally - access via Nginx subpath
    expose:
      - "9000"
      - "9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    command:
      - --admin-password=${PORTAINER_ADMIN_PASSWORD_HASH:-$$2y$$05$$eXampleHashHere}
      - --tls=false
    networks:
      - smart-home-net

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  portainer_data:
  prometheus_data:
  grafana_data:

networks:
  smart-home-net:
    driver: bridge
