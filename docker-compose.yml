version: '3.8'

services:
  # دیتابیس PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: smart-home-postgres
    restart: always
    environment:
      POSTGRES_DB: smart_home
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-u!I+(bUS1HhdqvSHZ$wMAy-M7Ci=GDYr}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart-home-net

  # دیتابیس InfluxDB (Time-Series)
  influxdb:
    image: influxdb:2-alpine
    container_name: smart-home-influxdb
    restart: always
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-SecureInfluxPass!}
      DOCKER_INFLUXDB_INIT_ORG: smart-home
      DOCKER_INFLUXDB_INIT_BUCKET: iot-data
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - smart-home-net

  # Redis (Cache)
  redis:
    image: redis:7-alpine
    container_name: smart-home-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-yftq!134Ng(!s-iR(6$T1c1%eeSFKyS_}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - smart-home-net

  # Mosquitto (MQTT Broker)
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smart-home-mosquitto
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    environment:
      MOSQUITTO_PASSWORD: ${MQTT_PASSWORD:-5@s$P(Ozfk8Cr6IMMqB18d*yiX@Kt-@)}
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - smart-home-net

  # بک‌اند Node.js
  backend:
    build: ./backend
    container_name: smart-home-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-u!I+(bUS1HhdqvSHZ$wMAy-M7Ci=GDYr}@postgres:5432/smart_home
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-d42fd690d42ed9753665652bb3945acbafb58b01c8b7edf3308b6607ed0c1c9c6d5c1f0e39a7d00c5ca24a5cea35e6a4e205dce1c5c099830331e3a6f1843af6}
      INFLUXDB_ORG: smart-home
      INFLUXDB_BUCKET: iot-data
      REDIS_URL: redis://:${REDIS_PASSWORD:-yftq!134Ng(!s-iR(6$T1c1%eeSFKyS_}@redis:6379
      MQTT_BROKER: mqtt://mosquitto:1883
      JWT_SECRET: ${JWT_SECRET:-9a40676872a1314f74c0a413ae0764359b3755ae98de750aec963223153cf34f27168fb9be0e031ccd03dbc4c29ad2616704b7d198f0a714dab385308e52b0ee}
      FRONTEND_URL: ${FRONTEND_URL:-https://your-domain.com}
      DB_PASSWORD: ${DB_PASSWORD:-u!I+(bUS1HhdqvSHZ$wMAy-M7Ci=GDYr}
      MQTT_USER: ${MQTT_USER:-smart_home_user}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-5@s$P(Ozfk8Cr6IMMqB18d*yiX@Kt-@)}
    depends_on:
      - postgres
      - influxdb
      - redis
      - mosquitto
    networks:
      - smart-home-net

  # فرانت‌اند Vue + Nginx
  frontend:
    build: .
    container_name: smart-home-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smart-home-net

  # Portainer (مدیریت گرافیکی Docker)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: smart-home-portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - smart-home-net

  # Prometheus (مانیتورینگ)
  prometheus:
    image: prom/prometheus:latest
    container_name: smart-home-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
    networks:
      - smart-home-net

  # Grafana (داشبورد مانیتورینگ)
  grafana:
    image: grafana/grafana:latest
    container_name: smart-home-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - smart-home-net

volumes:
  postgres_data:
  influxdb_data:
  redis_data:
  mosquitto_data:
  mosquitto_log:
  portainer_data:
  prometheus_data:
  grafana_data:

networks:
  smart-home-net:
    driver: bridge
